# نمونهٔ پیکربندی «لبه» (nginx میزبان) برای دامنهٔ سامانه
#
# این فایل نمونه است و در استقرار خودکار نصب نمی‌شود؛ مرجع نگه‌داری می‌شود تا
# تنظیمات لبه (از جمله gzip) در بازسازی‌های بعدی از دست نرود.
# معادل زندهٔ آن: /etc/nginx/sites-enabled/vidara-meeting.conf روی سرور.
#
# نکتهٔ مهم (فشرده‌سازی): بستهٔ JS/CSS برنامه حدود ۱ مگابایت است. اگر gzip در
# لبه و در پروکسی داکر فعال نباشد، این حجم خام به کاربر موبایل می‌رسد (اندازه‌گیری
#‌شده: ۱۰۶۷KB در برابر ۴۸۸KB با gzip و کاهش حدود ۵۰٪ زمان بارگذاری روی ۳G).
# بلوک gzip زیر فقط انواع متنی/استاتیک را فشرده می‌کند و text/event-stream را
# عمداً شامل نمی‌شود تا پاسخ‌های جریانی در آینده بافر نشوند.
server {
    listen  80 default_server;
    server_name vidara-meeting.ir;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 روی همان پورت TLS: چند درخواست هم‌زمان روی یک اتصال می‌روند و
    # سرباری هدرها کم می‌شود. نحو nginx ۱.۲۴ همین است (در ۱.۲۵+ می‌شود
    # جدا نوشت: listen 443 ssl; سپس http2 on;).
    listen 443 ssl http2;
    server_name vidara-meeting.ir;

    #    root /var/www/html;
    #   index index.html;

    ssl_certificate     /etc/letsencrypt/archive/vidara-meeting.ir/fullchain1.pem;
    ssl_certificate_key /etc/letsencrypt/archive/vidara-meeting.ir/privkey1.pem;

    location / {
     proxy_pass http://127.0.0.1:7080;
        proxy_http_version 1.1;
        proxy_set_header   "Connection" "";
        proxy_set_header   Accept-Encoding $http_accept_encoding;
        client_max_body_size 2048m;
	    #  try_files $uri $uri/ =404;

        # --- فشرده‌سازی در لبه (پشتیبان لایهٔ پروکسی داخلی) ---
        # فقط انواع متنی/استاتیک فشرده می‌شوند؛ text/event-stream عمداً در فهرست
        # نیست تا پاسخ‌های جریانی در آینده بافر نشوند.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            application/javascript
            application/json
            application/manifest+json
            image/svg+xml
            application/wasm;
    }

    access_log /var/log/nginx/meeting-access.log;
    error_log  /var/log/nginx/meeting-error.log;
}


server {
    listen 8443 ssl;
    server_name vidara-meeting.ir;

    #    root /var/www/html;
    #   index index.html;

    ssl_certificate     /etc/letsencrypt/archive/vidara-meeting.ir/fullchain1.pem;
    ssl_certificate_key /etc/letsencrypt/archive/vidara-meeting.ir/privkey1.pem;

location / {
        proxy_pass http://127.0.0.1:7443;
        proxy_http_version 1.1;
        proxy_set_header   "Connection" "";
        proxy_set_header   Host $http_host;
        client_max_body_size 2048m;
    }
    access_log /var/log/nginx/meeting-8443-access.log;
    error_log  /var/log/nginx/meeting-8443-error.log;
}
