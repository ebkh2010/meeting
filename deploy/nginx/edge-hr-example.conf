# نمونهٔ پیکربندی «لبه» برای نسخهٔ دوم (سامانهٔ HR) — دامنهٔ hr.vidara-meeting.ir
#
# این فایل معادل زندهٔ /etc/nginx/sites-enabled/hr-vidara-meeting.conf است.
# نسخهٔ دوم به‌صورت کاملاً مستقل روی همان سرور اجرا می‌شود:
#   سامانهٔ HR  → 127.0.0.1:7081   (نسخهٔ اول: 7080)
#   فایل‌های HR → 127.0.0.1:7444   (نسخهٔ اول: 7443)
#
# نکته: بلوک ۸۰ این دامنه «default_server» نیست؛ default_server فعلی همچنان
# به vidara-meeting.ir تعلق دارد و این بلوک فقط با تطبیق دقیق نام دامنه فعال می‌شود.

server {
    listen  80;
    server_name hr.vidara-meeting.ir;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # HTTP/2 روی همان پورت TLS (نحو nginx 1.24)
    listen 443 ssl http2;
    server_name hr.vidara-meeting.ir;

    # گواهی wildcard موجود (*.vidara-meeting.ir) — برای این زیردامنه معتبر است.
    ssl_certificate     /etc/letsencrypt/archive/vidara-meeting.ir/fullchain1.pem;
    ssl_certificate_key /etc/letsencrypt/archive/vidara-meeting.ir/privkey1.pem;

    location / {
        proxy_pass http://127.0.0.1:7081;
        proxy_http_version 1.1;
        proxy_set_header   "Connection" "";
        proxy_set_header   Accept-Encoding $http_accept_encoding;
        client_max_body_size 2048m;

        # فشرده‌سازی در لبه (پشتیبان لایهٔ پروکسی داخلی) — text/event-stream عمداً نیست
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_min_length 1024;
        gzip_types
            text/plain
            text/css
            application/javascript
            application/json
            application/manifest+json
            image/svg+xml
            application/wasm;
    }

    access_log /var/log/nginx/hr-meeting-access.log;
    error_log  /var/log/nginx/hr-meeting-error.log;
}

server {
    # مسیر فایل‌ها (نشانی‌های امضاشدهٔ آپلود/دانلود) روی همان دامنه و پورت جدا
    listen 8443 ssl;
    server_name hr.vidara-meeting.ir;

    ssl_certificate     /etc/letsencrypt/archive/vidara-meeting.ir/fullchain1.pem;
    ssl_certificate_key /etc/letsencrypt/archive/vidara-meeting.ir/privkey1.pem;

    location / {
        proxy_pass http://127.0.0.1:7444;
        proxy_http_version 1.1;
        proxy_set_header   "Connection" "";
        proxy_set_header   Host $http_host;
        client_max_body_size 2048m;
    }

    access_log /var/log/nginx/hr-storage-access.log;
    error_log  /var/log/nginx/hr-storage-error.log;
}
